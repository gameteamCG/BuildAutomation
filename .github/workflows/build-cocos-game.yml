name: Cocos Creator Build and Upload
on:
  repository_dispatch:
    types: [trigger-cocos-build]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository and Fetch LFS Objects
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.client_payload.branch }}
        lfs: true
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '14'
        
    - name: Install Dependencies
      run: npm install

    - name: Unzip Cocos Creator
      run: |
        unzip 2.4.8.zip -d CocosCreator

    - name: Build Cocos Project
      run: |
        ./CocosCreator/CocosCreator.app/Contents/MacOS/CocosCreator --path . --build "platform=web-mobile;debug=true;buildPath=build/web-mobile" --verbose
      
    - name: List Build Directory Contents
      run: ls -la build/web-mobile
    
    - name: Zip Build Output
      run: zip -r build.zip build/web-mobile/

    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: web-mobile-build
        path: build.zip
        if-no-files-found: warn

    - name: Configure Git
      run: |
        git config --global user.name 'ritheeshCG'
        git config --global user.email 'ritheesh@creativegalileo.com'

    - name: Commit Build Folder
      run: |
        git add build/
        git commit -m "Update build folder with latest build" || echo "No changes to commit"

    - name: Push Changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}

    - name: Upload to Slack
      run: |
        curl -F file=@build.zip -F channels=D0680486QTC,C067U15GV54 -F token=${{ secrets.SLACK_TOKEN }} -F initial_comment="Here is the latest Cocos Automation build." https://slack.com/api/files.upload
      shell: bash
