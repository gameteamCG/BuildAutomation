name: Cocos Creator Build and Upload

on:
  repository_dispatch:
    types: [trigger-cocos-build]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install Dependencies
      run: npm install

    - name: Create Directory
      run: |
        mkdir C:\cocos

    - name: Download Cocos Creator
      run: |
        Invoke-WebRequest -Uri 'https://s3.ap-south-1.amazonaws.com/cggames.creativegalileo.com/cocosInstaller/CocosCreator.exe' -OutFile 'C:\cocos\CocosCreator.exe'

    - name: Install Cocos Creator
      run: |
        C:\cocos\CocosCreator.exe /S /D=C:\cocos

    - name: Build Cocos Project
      run: |
        C:\cocos\CocosCreator.exe --path $GITHUB_WORKSPACE --build "platform=web-mobile;debug=false"

    - name: List Workspace Contents
      run: Get-ChildItem -Path "${env:GITHUB_WORKSPACE}" -Force

    - name: Show Current Working Directory
      run: Get-Location
      
    - name: List Build Output
      run: Get-ChildItem -Path "${env:GITHUB_WORKSPACE}\build\web-mobile" -Force

  
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v2
      with:
        name: web-mobile-build
        path: $GITHUB_WORKSPACE/build/web-mobile

    - name: Zip Build Output
      run: |
        Compress-Archive -Path $GITHUB_WORKSPACE/build/web-mobile -DestinationPath build.zip


    - name: Upload to Slack
      env:
        SLACK_TOKEN: ${{ secrets.xoxb-1857507923188-6274594411956-i6MTQlS5Q0vlh89mJCXp3JsO }}
        SLACK_CHANNEL: 'D0680486QTC'
      run: |
        curl -F file=@build.zip -F "initial_comment=New build available" -F channels=${SLACK_CHANNEL} -H "Authorization: Bearer ${SLACK_TOKEN}" https://slack.com/api/files.upload

    
    
