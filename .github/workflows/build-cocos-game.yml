name: Cocos Creator Build and Upload

on:
  repository_dispatch:
    types: [trigger-cocos-build]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install Dependencies
      run: npm install

    - name: Create Builds Directory
      run: New-Item -ItemType Directory -Force -Path C:\cocos\builds\${{ github.run_id }}

    - name: Build Cocos Project
      run: Start-Process -FilePath "C:\cocos\CocosCreator.exe" -ArgumentList "--path $GITHUB_WORKSPACE --build `"`"platform=web-mobile;debug=false;buildPath=C:/cocos/builds/8264497506`"`"" -NoNewWindow -Wait


    - name: Zip Build Output
      run: Compress-Archive -Path C:\cocos\builds\${{ github.run_id }} -DestinationPath $GITHUB_WORKSPACE/build.zip

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v2
      with:
        name: web-mobile-build-${{ github.run_id }}
        path: $GITHUB_WORKSPACE/build.zip

    - name: Upload to Slack
      env:
        SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }} # Ensure you've set SLACK_BOT_TOKEN in your repository's secrets
        SLACK_CHANNEL: 'D0680486QTC'
      run: |
        curl -F file=@$GITHUB_WORKSPACE/build.zip -F "initial_comment=New build available" -F channels=${SLACK_CHANNEL} -H "Authorization: Bearer ${SLACK_TOKEN}" https://slack.com/api/files.upload
