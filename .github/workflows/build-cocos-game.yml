name: Cocos Creator Build and Upload (Windows)
on:
  repository_dispatch:
    types: [trigger-cocos-build]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository and Fetch LFS Objects
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.client_payload.branch }}
        lfs: true
        
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '14'
        
    - name: Install Dependencies
      run: npm install
      shell: cmd

    - name: Unzip Cocos Creator with 7-Zip
      run: 7z x 2.4.8.zip -oCocosCreator
      shell: cmd

    - name: List CocosCreator Directory Contents
      run: dir CocosCreator
      shell: cmd

    - name: Build Cocos Project
      run: .\CocosCreator\2.4.8\CocosCreator.exe --path . --build "platform=web-mobile;debug=true;buildPath=build\web-mobile"
      shell: cmd
      
    - name: Zip Build Output
      run: Compress-Archive -Path build/web-mobile/* -DestinationPath build.zip
      shell: powershell

    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: web-mobile-build
        path: build.zip

    - name: Configure Git
      run: |
        git config --global user.name 'ritheeshCG'
        git config --global user.email 'ritheesh@creativegalileo.com'
      shell: cmd

    - name: Commit Build Folder
      run: |
        git add build/
        git commit -m "Update build folder with latest build" || echo "No changes to commit"
      shell: cmd

    - name: Push Changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.event.client_payload.branch }}


    - name: Upload to Slack
      run: |
        curl -F file=@build.zip -F channels=D0680486QTC,C067U15GV54 -F token=${{ secrets.SLACK_TOKEN }} -F initial_comment="Here is the latest Cocos Automation build." https://slack.com/api/files.upload
      shell: bash
